name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      runtime_version:
        description: "Foundry Local runtime version (blank = latest stable on NuGet)"
        required: false
        default: ""
      release_tag:
        description: "Publish a release with this tag, e.g. v0.2.0 (blank = no release)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            lib_glob: "*.dll"
            exe: tutor-test.exe
          - os: macos-15
            name: mac-arm64
            lib_glob: "*.dylib"
            exe: tutor-test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      # Windows: build the C runtime into the program so it doesn't depend on it being installed.
      RUSTFLAGS: ${{ matrix.os == 'windows-latest' && '-C target-feature=+crt-static' || '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Pick the Foundry Local runtime version
        run: |
          set -euo pipefail
          version="${{ github.event.inputs.runtime_version }}"
          if [ -z "$version" ]; then
            version=$(curl -fsSL https://api.nuget.org/v3-flatcontainer/microsoft.ai.foundry.local.runtime/index.json \
              | python3 -c 'import json,sys; v=[x for x in json.load(sys.stdin)["versions"] if "-" not in x]; print(v[-1])')
          fi
          echo "Foundry Local runtime $version"
          echo "FOUNDRY_LOCAL_RUNTIME_VERSION=$version" >> "$GITHUB_ENV"

      - name: Lint
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings

      - name: Unit tests
        run: |
          set -o pipefail
          if ! cargo test 2>&1 | tee test.log; then
            # Surface failures as annotations (readable without the full log).
            grep -E "panicked|FAILED|assertion|left:|right:|error" test.log | head -20 | while IFS= read -r line; do
              echo "::error title=Unit test::$line"
            done
            exit 1
          fi

      - name: Build
        run: cargo build --release

      - name: Package
        run: |
          set -euo pipefail
          out_dir=$(ls -d target/release/build/foundry-local-sdk-*/out | head -1)
          pkg="dist/tutor-test-${{ matrix.name }}"
          mkdir -p "$pkg"
          cp "target/release/${{ matrix.exe }}" "$pkg/"
          shopt -s nullglob
          libs=("$out_dir"/${{ matrix.lib_glob }})
          if [ ${#libs[@]} -eq 0 ]; then echo "No engine libraries found in $out_dir"; ls -la "$out_dir"; exit 1; fi
          cp "${libs[@]}" "$pkg/"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            # Microsoft Visual C++ runtime for the engine's own DLLs (app-local copy).
            for dll in vcruntime140.dll vcruntime140_1.dll msvcp140.dll; do
              cp "/c/Windows/System32/$dll" "$pkg/" || echo "warning: $dll not found"
            done
          fi
          cp docs/HOW-TO-RUN.txt "$pkg/"
          echo "Foundry Local runtime ${FOUNDRY_LOCAL_RUNTIME_VERSION}" > "$pkg/VERSIONS.txt"
          echo "Tutor test $(grep -m1 '^version' Cargo.toml | cut -d'"' -f2), commit ${GITHUB_SHA::7}" >> "$pkg/VERSIONS.txt"
          ls -la "$pkg"
          echo "PKG=$pkg" >> "$GITHUB_ENV"

      - name: List the model catalog
        run: |
          "$PKG/${{ matrix.exe }}" --list < /dev/null | tee catalog.txt
          # Chat models only, a few lines per annotation (readable without the log).
          grep -v -i -E "whisper|embed|vision|ALIAS" catalog.txt \
            | awk '{printf "%s %s %s %s | ", $1, $2, $3, $4} NR%12==0 {print ""} END {print ""}' \
            | while IFS= read -r chunk; do [ -n "$chunk" ] && echo "::notice title=Catalog::$chunk"; done

      - name: End-to-end run with the smallest models
        run: |
          # GitHub runs steps with -e; turn it off so a crash is reported, not fatal.
          set +e -uo pipefail
          failed=0
          for model in qwen2.5-0.5b qwen3-0.6b; do
            "$PKG/${{ matrix.exe }}" --models "$model" --cases 3 --no-open --cleanup --out "smoke/$model" < /dev/null > "run-$model.log" 2>&1
            code=$?
            cat "run-$model.log"
            if [ $code -ne 0 ]; then
              failed=1
              echo "::error title=$model exited with $code::see the following annotations for its last output"
              tail -n 15 "run-$model.log" | tr -d '\r' | while IFS= read -r line; do
                [ -n "$line" ] && echo "::error title=$model output::$line"
              done
            fi
          done
          set -e
          for report in smoke/*/tutor-test-*/; do
            python3 - "$report/results.json" <<'EOF'
          import json, sys
          run = json.load(open(sys.argv[1]))
          def notice(title, msg):
              # Annotations are readable without the full log.
              msg = msg.replace("%", "%25").replace("\r", "").replace("\n", " ")
              print(f"::notice title={title}::{msg[:900]}")
          acc = run["accelerators"]
          notice("Accelerators", f'registered={acc["registered"]} failed={acc["failed"]} note={acc["note"]}')
          for m in run["models"]:
              notice("Model", f'{m["alias"]} {m["variant"]} on {m["device"]} / {m["execution_provider"]}, '
                              f'load {m["load_s"]}s, warm-up {m["warmup_s"]}s, error={m["error"]}')
              for h in m["hints"]:
                  notice(f'Hint {h["case_id"]}', f'{h["total_s"]:.1f}s, first words {h["first_token_s"]}s, '
                                                 f'{h["tokens"]} tokens, thought {h["thinking_words"]} words, rewrite {h["rewrite_s"]}s, '
                                                 f'checks={h["checks"]}, error={h["error"]} :: {h["text"]}'
                                                 + (f' || FIRST TRY: {h["first_text"]}' if h["first_text"] else ''))
          answered = sum(1 for m in run["models"] for h in m["hints"] if not h["error"])
          if answered == 0:
              sys.exit("No hints were answered")
          EOF
            cp "$report/report.html" "smoke-report-$(basename "$(dirname "$report")").html"
          done
          exit $failed

      - uses: actions/upload-artifact@v5
        with:
          name: tutor-test-${{ matrix.name }}
          path: ${{ env.PKG }}
          retention-days: 30

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: smoke-report-${{ matrix.name }}
          path: |
            smoke-report-*.html
            run-*.log
            catalog.txt
          if-no-files-found: ignore
          retention-days: 14

  release:
    # A v* tag push, or a manual run with release_tag, publishes the zips on the
    # Releases page (plain links, no sign-in).
    # Runs even if a build was cancelled (GitHub's Mac machines are sometimes
    # unavailable); publishes whatever built, as long as Windows did.
    if: always() && (startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_tag != '')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # One download per build, each into its own folder (a pattern that matches
      # only one artifact would unpack it without a folder).
      - uses: actions/download-artifact@v5
        with:
          name: tutor-test-windows-x64
          path: dist/tutor-test-windows-x64
      - uses: actions/download-artifact@v5
        continue-on-error: true
        with:
          name: tutor-test-mac-arm64
          path: dist/tutor-test-mac-arm64
      - name: Zip each package
        run: |
          set -euo pipefail
          cd dist
          if [ ! -d tutor-test-windows-x64 ]; then echo "::error::The Windows build is missing; not publishing."; exit 1; fi
          if [ -z "$(ls -A tutor-test-mac-arm64 2>/dev/null)" ]; then
            rm -rf tutor-test-mac-arm64
            echo "::warning::The Mac build is missing; publishing Windows only."
          fi
          for d in tutor-test-*/; do
            name="${d%/}"
            (cd "$name" && zip -qr "../$name.zip" .)
          done
          ls -la
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.release_tag }}"
          [ -n "$tag" ] || tag="${GITHUB_REF_NAME}"
          notes="Windows: download tutor-test-windows-x64.zip, extract it, open the folder and double-click tutor-test.exe (see HOW-TO-RUN.txt inside).
          Mac: download tutor-test-mac-arm64.zip, unzip it, and in Terminal inside that folder run: chmod +x tutor-test; xattr -dr com.apple.quarantine .; ./tutor-test"
          gh release create "$tag" dist/*.zip --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Tutor test $tag" --notes "$notes" --latest
