[[case]]
id = "fstring-missing-f"
title = "Building HTML: f missing before the string"
lesson = "Making a web page with Python"
task = "Build a heading tag from the title variable. It should be <h1>My Garden</h1>."
code = '''
title = "My Garden"
html = "<h1>{title}</h1>"
print(html)
'''
output = '''
<h1>{title}</h1>

Check failed: expected <h1>My Garden</h1>, got <h1>{title}</h1>
'''
mentions = ["f-string", "f\"", "f before", "letter f", "prefix"]
giveaway = "html = f\"<h1>{title}</h1>\""
