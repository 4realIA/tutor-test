# Beginner mistakes the tutor is tested on.
#
# Each case is what the app would hand the tutor: the lesson, the exercise,
# the learner's code and what running it printed. `mentions` lists words a
# useful hint is likely to contain (any one counts). `giveaway` is the fixed
# line: a hint that contains it has handed over the answer instead of a nudge.

[[case]]
id = "missing-colon"
title = "Missing colon after if"
lesson = "Making decisions with if"
task = "Print \"Hot day!\" when the temperature is above 30."
code = '''
temperature = 34
if temperature > 30
    print("Hot day!")
'''
output = '''
  File "main.py", line 2
    if temperature > 30
                       ^
SyntaxError: expected ':'
'''
mentions = ["colon"]
giveaway = "if temperature > 30:"

[[case]]
id = "indentation"
title = "Loop body not indented"
lesson = "Repeating with for loops"
task = "Print each fruit in the list on its own line."
code = '''
fruits = ["apple", "pear", "plum"]
for fruit in fruits:
print(fruit)
'''
output = '''
  File "main.py", line 3
    print(fruit)
    ^^^^^
IndentationError: expected an indented block after 'for' statement on line 2
'''
mentions = ["indent", "space", "inside"]
giveaway = "    print(fruit)"

[[case]]
id = "assign-vs-compare"
title = "= instead of =="
lesson = "Making decisions with if"
task = "Print \"Welcome back!\" when the name is \"Rose\"."
code = '''
name = "Rose"
if name = "Rose":
    print("Welcome back!")
'''
output = '''
  File "main.py", line 2
    if name = "Rose":
       ^^^^^^^^^^^^^
SyntaxError: invalid syntax. Maybe you meant '==' or ':=' instead of '='?
'''
mentions = ["==", "compare", "comparison", "equal"]
giveaway = "if name == \"Rose\":"

[[case]]
id = "str-plus-int"
title = "Joining text and a number"
lesson = "Text and numbers together"
task = "Print \"You are 72 years old\" using the age variable."
code = '''
age = 72
print("You are " + age + " years old")
'''
output = '''
Traceback (most recent call last):
  File "main.py", line 2, in <module>
    print("You are " + age + " years old")
          ~~~~~~~~~~~^~~~~
TypeError: can only concatenate str (not "int") to str
'''
mentions = ["str(", "f-string", "f\"", "text", "string", "number"]
giveaway = "print(\"You are \" + str(age) + \" years old\")"

[[case]]
id = "input-is-text"
title = "input() gives text, not a number"
lesson = "Asking the user with input()"
task = "Ask for two numbers and print their sum. With 5 and 3 it should print 8."
code = '''
a = input("First number: ")
b = input("Second number: ")
print(a + b)
'''
output = '''
First number: 5
Second number: 3
53

Check failed: expected 8, got 53
'''
mentions = ["int(", "text", "string", "number", "convert"]
giveaway = "a = int(input("

