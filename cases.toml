giveaway = "colours[-1]"

[[case]]
id = "endless-loop"
title = "while loop that never ends"
lesson = "Repeating with while loops"
task = "Count down from 5 to 1, then print \"Lift off!\"."
code = '''
count = 5
while count > 0:
    print(count)
print("Lift off!")
'''
output = '''
5
5
5
5
5
(the same number kept printing)

Stopped: the program ran for more than 5 seconds
'''
mentions = ["change", "smaller", "decrease", "count -", "-= 1", "never", "forever"]
giveaway = "count -= 1"

