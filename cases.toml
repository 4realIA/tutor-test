[[case]]
id = "print-not-return"
title = "Function prints instead of returning"
lesson = "Writing your own functions"
task = "Write double(n) that gives back n times 2, so double(4) is 8."
code = '''
def double(n):
    print(n * 2)

result = double(4)
print("Result:", result)
'''
output = '''
8
Result: None

Check failed: double(4) should return 8, got None
'''
mentions = ["return"]
giveaway = "return n * 2"

[[case]]
